app-id: org.viking.Viking
# https://docs.flatpak.org/en/latest/available-runtimes.html
# NB Viking doesn't use any Gnome specifics so freedesktop should suffice for the build
# Albeit Yelp for help is Gnome only
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: viking
rename-icon: viking
copy-icon: true
rename-desktop-file: viking.desktop
finish-args:
  - --share=network
  - --system-talk-name=org.freedesktop.GeoClue2
  - --share=ipc
  - --socket=x11
# Allow to read/save anywhere (subject to normal permissions)
  - --filesystem=host
cleanup:
  - '/bin/exi*'
  - '/bin/ipt*'
  - '/bin/xmp*'
  - '/bin/m*'
  - '/bin/addmoddel'
  - '/bin/geotag'
  - '/bin/taglist'
  - '/bin/scons*'
  - '/bin/zip*'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '/lib/scons-*'
  - /man
  - /share/man
  - '*.la'
  - '*.a'

modules:
# Shared modules 'git submodule' - https://github.com/flathub/shared-modules
  - shared-modules/intltool/intltool-0.51.json

  - name: libzip
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.8.0.tar.xz
        sha256: f0763bda24ba947e80430be787c4b068d8b6aa6027a26a19923f0acfa3dac97e

# gexiv2/exiv2 cribbed from GIMP json build
# https://github.com/flathub/org.gimp.GIMP/blob/master/org.gimp.GIMP.json
  - name: exiv2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_ENABLE_INIH=OFF
      - -DEXIV2_ENABLE_VIDEO=OFF
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/archive/refs/tags/v0.28.5.tar.gz
        sha256: e1671f744e379a87ba0c984617406fdf8c0ad0c594e5122f525b2fb7c28d394d

# gexiv2 0.15 has breaking API changes incompatible with viking 0.10
  - name: gexiv2
    buildsystem: meson
    config-opts:
      - -Dintrospection=false
      - -Dpython3=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gexiv2/0.14/gexiv2-0.14.2.tar.xz
        sha256: 2a0c9cf48fbe8b3435008866ffd40b8eddb0667d2212b42396fdf688e93ce0be

# scons shamelessly copied from
# https://github.com/scx/gpick-flatpak/blob/master/scons.yaml
  - name: scons
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix="${FLATPAK_DEST}";
    sources:
      - type: archive
        url: http://download.sourceforge.net/scons/scons-3.1.2.tar.gz
        sha256: 7801f3f62f654528e272df780be10c0e9337e897650b62ddcee9f39fde13f8fb

  - name: gpsd
    buildsystem: simple
    build-commands:
      - scons minimal=yes shared=True gpsd=False gpsdclients=False prefix="${FLATPAK_DEST}" && scons install
    sources:
      - type: archive
        url: https://download-mirror.savannah.gnu.org/releases/gpsd/gpsd-3.26.tar.xz
        sha256: dd8c1b7b9a7bb174099373c4e98dac67c3845fbe4833e07829e0c8dbe594cf06

  - name: viking
    buildsystem: autotools
    config-opts:
# Mapnik is expansive C++ dependencies, but more importantly creating maps generally requires a complex system setup for runtime usage
#  thus seemingly out of scope for a flatpak app anyway - so disable for now.
      - --disable-mapnik
# viking only supports oauth1 through https://github.com/x42/liboauth.git to authenticate against OSM, but OSM shut down its oauth1 in 2024
      - --disable-oauth
    post-install:
      - install -D org.viking.Viking.appdata.xml /app/share/metainfo/org.viking.Viking.metainfo.xml
      - install -Dm644 viking-128.png /app/share/icons/hicolor/128x128/apps/viking.png
    sources:
      - type: git
        url: https://git.code.sf.net/p/viking/code
        tag: viking-1.10
        commit: 1f9cef11e1c9ed64a93a32be9a100042e7dadf6f
      - type: file
        path: org.viking.Viking.appdata.xml
      - type: file
        path: viking-128.png
